name: Autonomous GTA 5 & 6 Live Stream Scout & Auto-Clipping Shorts Engine

on:
  schedule:
    # Runs every 30 minutes throughout the day (scout check takes ~20s if no stream is live)
    - cron: '*/30 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry Run (Render video but do NOT upload to YouTube)'
        type: boolean
        required: false
        default: true
      save_artifact:
        description: 'Save .mp4 video artifact (WARNING: Consumes GitHub artifact storage)'
        type: boolean
        required: false
        default: false
      target_streamer:
        description: 'Specific VIP streamer name (leave empty to scan all)'
        type: string
        required: false
        default: ''
      custom_url:
        description: 'Direct YouTube stream/VOD URL to clip on-demand'
        type: string
        required: false
        default: ''
      max_shorts:
        description: 'Max shorts to generate in this run'
        type: choice
        options: ['1', '2', '3']
        default: '1'
      force:
        description: 'Force process even if previously clipped'
        type: boolean
        required: false
        default: false

permissions:
  contents: write

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 1: Fast Radar Scout (~20 seconds) — Zero Artifact Storage
  # Checks VIP watchlist + Global live streams directly.
  # ─────────────────────────────────────────────────────────────────────────────
  scout:
    name: "⚡ Stream Radar Scout (0 MB Artifacts)"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      has_live: ${{ steps.radar.outputs.has_live }}
      live_url: ${{ steps.radar.outputs.live_url }}
      streamer_name: ${{ steps.radar.outputs.streamer_name }}
      stream_title: ${{ steps.radar.outputs.stream_title }}
      concurrent_viewers: ${{ steps.radar.outputs.concurrent_viewers }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Scout Dependencies
        run: |
          python -m pip install --upgrade pip --quiet
          pip install requests python-dotenv yt-dlp --quiet

      - name: Run Stream Radar
        id: radar
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MIN_VIEWERS: ${{ vars.MIN_VIEWERS || 500 }}
          TARGET_GAME: ${{ vars.TARGET_GAME || 'Grand Theft Auto V' }}
          TARGET_SEARCH_QUERY: ${{ vars.TARGET_SEARCH_QUERY || 'GTA 5 live stream OR GTA V gameplay live' }}
        run: |
          python - <<'SCOUT_EOF'
          import os, sys, json
          from scout import StreamScout
          from config import load_history

          min_v = int(os.getenv("MIN_VIEWERS", "500"))
          scout = StreamScout(min_viewers=min_v)
          history = load_history().get("processed_videos", {})

          # Search streams
          streams = scout.scout_all(target_streamer="${{ inputs.target_streamer }}")
          
          # Filter eligible streams that have not exceeded clip limit
          eligible_stream = None
          for st in streams:
              existing_clips = len(history.get(st.video_id, {}).get("clips", []))
              if existing_clips < 3:
                  eligible_stream = st
                  break

          env_file = os.environ.get("GITHUB_OUTPUT", "")
          if eligible_stream and env_file:
              print(f"🎯 LIVE STREAM DETECTED: {eligible_stream.streamer_name} ({eligible_stream.concurrent_viewers:,} viewers)")
              print(f"   Title: {eligible_stream.title}")
              print(f"   URL:   {eligible_stream.url}")
              with open(env_file, "a", encoding="utf-8") as ef:
                  ef.write("has_live=true\n")
                  ef.write(f"live_url={eligible_stream.url}\n")
                  ef.write(f"streamer_name={eligible_stream.streamer_name}\n")
                  # Sanitize title for GITHUB_OUTPUT
                  clean_title = eligible_stream.title.replace("\n", " ").replace("\r", "")
                  ef.write(f"stream_title={clean_title}\n")
                  ef.write(f"concurrent_viewers={eligible_stream.concurrent_viewers}\n")
          elif env_file:
              print("📡 Radar scan complete: No eligible live gameplay streams online right now.")
              with open(env_file, "a", encoding="utf-8") as ef:
                  ef.write("has_live=false\n")
                  ef.write("live_url=\n")
                  ef.write("streamer_name=\n")
                  ef.write("stream_title=\n")
                  ef.write("concurrent_viewers=0\n")
          SCOUT_EOF

      - name: Print Scout Result
        run: |
          echo "Has live stream: ${{ steps.radar.outputs.has_live }}"
          if [ "${{ steps.radar.outputs.has_live }}" = "true" ]; then
            echo "Streamer: ${{ steps.radar.outputs.streamer_name }}"
            echo "Title:    ${{ steps.radar.outputs.stream_title }}"
            echo "Viewers:  ${{ steps.radar.outputs.concurrent_viewers }}"
            echo "URL:      ${{ steps.radar.outputs.live_url }}"
          fi

  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 2: Highlight Clipping, AI Curation & Rendering
  # Runs only when a live stream is active (or on manual workflow_dispatch)
  # ─────────────────────────────────────────────────────────────────────────────
  clip_and_render:
    name: "🎬 Clip, Curate & Render"
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs: scout
    if: needs.scout.outputs.has_live == 'true' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install FFmpeg & Fonts
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg fonts-liberation fonts-dejavu fonts-noto-color-emoji
          ffmpeg -version | head -n 2

      - name: Install Python Requirements
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt

      - name: Execute Autonomous Pipeline
        id: pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          MIN_VIEWERS: ${{ vars.MIN_VIEWERS || 500 }}
          MIN_VIRAL_SCORE: ${{ vars.MIN_VIRAL_SCORE || 6 }}
          UPLOAD_PRIVACY_STATUS: ${{ vars.UPLOAD_PRIVACY_STATUS || 'public' }}
          # TODAY: Respect dry_run input (defaults to true) and AUTO_UPLOAD=false
          AUTO_UPLOAD: "false"
          LOG_LEVEL: INFO
          TARGET_URL: ${{ inputs.custom_url || needs.scout.outputs.live_url }}
        run: |
          echo "============================================================"
          echo "🚀 STARTING SHORTS ENGINE EXECUTION"
          echo "   Target URL: $TARGET_URL"
          echo "   Dry Run:    ${{ inputs.dry_run }}"
          echo "============================================================"

          if [ -n "$TARGET_URL" ]; then
            CMD="python main.py clip --url \"$TARGET_URL\" --max-shorts ${{ inputs.max_shorts || 1 }}"
          else
            CMD="python main.py run --max-shorts ${{ inputs.max_shorts || 1 }}"
          fi

          if [ "${{ inputs.dry_run }}" != "false" ]; then
            CMD="$CMD --dry-run"
          fi
          if [ "${{ inputs.force }}" = "true" ]; then
            CMD="$CMD --force"
          fi

          echo "Executing: $CMD"
          eval $CMD

      - name: Generate GitHub Step Summary (Viewable from Office Mac)
        if: always()
        env:
          SCOUTED_STREAMER: ${{ needs.scout.outputs.streamer_name }}
        run: |
          python - <<'SUMMARY_EOF'
          import os, json, glob
          from pathlib import Path

          output_dir = Path("output")
          shorts = list(output_dir.glob("*.mp4")) if output_dir.exists() else []
          history_file = Path("history.json")
          
          summary_path = os.getenv("GITHUB_STEP_SUMMARY")
          if not summary_path:
              exit(0)

          history_data = {}
          if history_file.exists():
              try:
                  with open(history_file, "r", encoding="utf-8") as f:
                      history_data = json.load(f)
              except Exception:
                  pass

          clips_published = history_data.get("clips_published", [])
          last_clip = clips_published[-1] if clips_published else {}

          with open(summary_path, "a", encoding="utf-8") as s:
              s.write("## 🎮 Autonomous GTA Shorts Engine — Run Summary\n\n")
              
              if shorts or last_clip:
                  s.write("### ✅ Execution Succeeded — Clip Generated!\n\n")
                  s.write("| Attribute | Value |\n")
                  s.write("|---|---|\n")
                  s.write(f"| **Target Game** | GTA 5 Live Gameplay |\n")
                  streamer_name = last_clip.get('streamer') or os.getenv('SCOUTED_STREAMER', 'Live Streamer')
                  s.write(f"| **Streamer** | `{streamer_name}` |\n")
                  s.write(f"| **Viral Short Title** | **{last_clip.get('title', 'High-Octane GTA 5 Moment')}** |\n")
                  s.write(f"| **AI Virality Score** | ⭐ `{last_clip.get('viral_score', 9)} / 10` |\n")
                  s.write(f"| **Video File** | `{shorts[0].name if shorts else 'Rendered'}` |\n")
                  s.write(f"| **File Size** | `{f'{shorts[0].stat().st_size / (1024*1024):.2f} MB' if shorts else 'N/A'}` |\n")
                  s.write(f"| **Upload Status** | 🛡️ **SKIPPED (Dry-Run Mode Active — No Upload Today)** |\n")
                  s.write(f"| **Anti-Copyright Filters** | ✅ Micro-pitch shift (+1.2%), EQ Dynamic Audio, Video Contrast Grade |\n")
                  s.write(f"| **Karaoke Subtitles** | ✅ Alex Hormozi Bouncing Kinetic Subtitles Burned |\n")
                  s.write(f"| **Artifact Storage Consumed** | **0 MB** (Account Quota Protected) |\n\n")
              else:
                  s.write("### ℹ️ Radar Report\n\n")
                  s.write("No eligible live GTA gameplay streams above viewer threshold right now, or clips were already processed.\n\n")
                  s.write("- **Artifact Storage Used:** `0 MB`\n")
                  s.write("- **Next Scheduled Radar Check:** In 30 minutes.\n")
          SUMMARY_EOF

      - name: Commit Updated History (Prevents Duplicate Clips)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain history.json)" ]; then
            git add history.json
            git commit -m "chore(history): update processed clips archive [skip ci]"
            git push
          else
            echo "No changes in history.json to commit."
          fi

      # ─────────────────────────────────────────────────────────────────────────
      # Artifact storage: ONLY uploaded if user explicitly toggles save_artifact=true
      # Default: FALSE -> 0 MB artifact storage consumed!
      # ─────────────────────────────────────────────────────────────────────────
      - name: Optional Video Preview Artifact
        if: ${{ inputs.save_artifact == true }}
        uses: actions/upload-artifact@v4
        with:
          name: preview-short
          path: output/*.mp4
          if-no-files-found: ignore
          retention-days: 1
